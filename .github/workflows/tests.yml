name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learning-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  desktop-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:client
      - run: pnpm run test:client
      - run: pnpm run setup:desktop
      - run: pnpm run pack:desktop
      - name: Test packaged Electron app
        run: xvfb-run -a pnpm run test:electron
        env:
          ELECTRON_TEST_EXECUTABLE: desktop/dist/linux-unpacked/junior-mode-desktop
